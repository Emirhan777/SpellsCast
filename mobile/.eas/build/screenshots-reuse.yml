build:
  name: Capture screenshots from an existing iOS Simulator archive
  steps:
    - eas/checkout
    - eas/install_maestro
    - run:
        name: Download existing simulator app
        command: node scripts/download-simulator-app.cjs
    - run:
        name: Prepare iPhone simulator
        command: node scripts/prepare-ios-screenshots.cjs artifacts/simulator-app
    - run:
        name: Capture real iOS screens
        command: maestro --device "$(cat artifacts/screenshots/device-udid.txt)" test --test-output-dir artifacts/screenshots/maestro .maestro/store-screenshots.yml
    - eas/upload_artifact:
        name: Upload iOS screenshots
        if: ${ always() }
        inputs:
          type: build-artifact
          path: mobile/artifacts/screenshots
