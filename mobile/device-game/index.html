<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src 'none'; connect-src 'none'">
<title>SpellsCast · Play on this device</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0d0917;color:#fff;font:14px system-ui;-webkit-user-select:none;user-select:none}body{display:flex;flex-direction:column}button{font:700 14px system-ui;min-height:44px;padding:8px 14px;border:1px solid #584363;border-radius:12px;color:#f5e6c4;background:#281d35}button:disabled{opacity:.5}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px}#score{font-size:25px}#lives{color:#ff999c}#arena{position:relative;flex:1;min-height:160px}#game{width:100%;height:100%;display:block}#intro,#paused{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;background:#100b1cdd}#intro h1{margin:0;color:#eed297;font-size:28px}p{margin:0;line-height:1.5;color:#c8bcd6}#paused[hidden],#intro[hidden]{display:none}#play{background:#eed297;color:#281b31}#runes{display:flex;justify-content:space-around;padding:8px 4px;gap:4px;border-top:1px solid #31223f}.rune{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;gap:2px}.rune svg{width:38px;height:38px}#feedback{height:24px;text-align:center;color:#eed297;font-size:12px;padding:3px}#pad{position:relative;flex-shrink:0;height:29%;min-height:105px;max-height:240px;margin:0 12px 10px;border:2px solid #6c5836;border-radius:24px;background:#1d1429;touch-action:none;overflow:hidden}#pad svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#pad span{position:absolute;inset:0;display:grid;place-items:center;color:#a99ab9;font-size:12px;pointer-events:none}#pad.casting{border-color:#eed297;background:#302039}#pad.casting span{opacity:0}.controls{display:flex;gap:6px}@media(max-height:500px){#runes{padding:3px}.rune svg{width:25px;height:25px}#pad{height:25%;min-height:75px}#feedback{height:20px}}
</style></head><body>
<header><div><span id="score">0</span> <span id="lives" aria-label="3 lives remaining">● ● ●</span></div><div class="controls"><button id="sound" aria-label="Turn sound on">Sound off</button><button id="pause" disabled>Pause</button></div></header>
<main id="arena"><canvas id="game" aria-label="Spell targets and game action"></canvas><div id="intro"><h1>SpellsCast</h1><p>Watch the targets above.<br>Draw their rune on the pad below, then lift to cast.</p><button id="play">Start game</button><p>Full game · no room or internet needed</p></div><div id="paused" hidden><h2>Game paused</h2><p>Ready after mirroring your screen?</p><button id="resume">Resume game</button></div></main>
<div id="runes" aria-label="Spellbook"></div><div id="feedback" role="status">Draw on the pad. Lift to cast.</div>
<div id="pad" role="application" aria-label="Draw a spell rune here"><span>DRAW A RUNE HERE · LIFT TO CAST</span><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="trace" fill="none" stroke="#eed297" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<script>/* GAME_SCRIPT */</script></body></html>
