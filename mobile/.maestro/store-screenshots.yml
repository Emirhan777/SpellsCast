appId: com.emirhansimsek.spellscast
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: play-device-button
    timeout: 60000
- takeScreenshot: 01-home
- scrollUntilVisible:
    element:
      id: start-game-button
    direction: DOWN
- tapOn:
    id: start-game-button
- assertVisible: Play on this device
- takeScreenshot: 02-start-a-game
- tapOn: Back
- tapOn:
    id: join-game-button
- scrollUntilVisible:
    element:
      id: scan-button
    direction: DOWN
- takeScreenshot: 03-join-a-game
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: practice-button
    direction: DOWN
- tapOn:
    id: practice-button
- assertVisible: SPELL PRACTICE
- takeScreenshot: 04-practice-expel
- tapOn: 'Levitate:.*'
- takeScreenshot: 05-practice-levitate
- tapOn: 'Banish:.*'
- takeScreenshot: 06-practice-banish
- launchApp:
    clearState: true
- tapOn:
    id: play-device-button
- extendedWaitUntil:
    visible: Hold anywhere. Cast to begin.
    timeout: 30000
- takeScreenshot: 07-landscape-game
